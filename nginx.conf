server {
    listen 80;
    server_name _;

    # www → non-www redirect
    if ($host = "www.cdtwarehouse.com") {
        return 301 https://cdtwarehouse.com$request_uri;
    }

    # HTTP → HTTPS redirect (Dokploy's Traefik sets X-Forwarded-Proto)
    if ($http_x_forwarded_proto = 'http') {
        return 301 https://$host$request_uri;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml image/webp;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # Root for the static export
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively
    location ~* \.(webp|jpg|jpeg|png|svg|ico|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — serve index.html for any unknown route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
