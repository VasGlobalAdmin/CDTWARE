services:
  # ---------- Frontend (Nginx serving static export) ----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"

      # --- Main site + www both route to nginx ---
      - "traefik.http.routers.cdtwarehouse.rule=Host(`cdtwarehouse.com`, `www.cdtwarehouse.com`)"
      - "traefik.http.routers.cdtwarehouse.entrypoints=web"
      - "traefik.http.routers.cdtwarehouse.middlewares=redirect-to-https@file"

      - "traefik.http.routers.cdtwarehouse-secure.rule=Host(`cdtwarehouse.com`, `www.cdtwarehouse.com`)"
      - "traefik.http.routers.cdtwarehouse-secure.entrypoints=websecure"
      - "traefik.http.routers.cdtwarehouse-secure.tls.certresolver=letsencrypt"

      # --- Service ---
      - "traefik.http.services.cdtwarehouse-service.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true
